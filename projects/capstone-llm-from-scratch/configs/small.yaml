# ClearMind-Mini 配置 (~26M 参数)
# 适用于 MacBook CPU/MPS 训练
# 训练时间: ~3-6 小时 (MacBook), ~15 分钟 (A100)

model:
  d_model: 512          # 隐藏层维度
  n_heads: 8            # 注意力头数
  n_kv_heads: 8         # KV 头数 (等于 n_heads = 标准 MHA)
  n_layers: 8           # Transformer 层数
  d_ff: 1408            # FFN 中间维度 (≈ 2.75 × d_model)
  vocab_size: 8000      # 词表大小
  max_seq_len: 512      # 最大序列长度
  dropout: 0.1          # Dropout 比率
  norm_eps: 1.0e-6      # RMSNorm epsilon

tokenizer:
  model_type: bpe
  vocab_size: 8000
  character_coverage: 0.9995

pretrain:
  batch_size: 16
  gradient_accumulation: 4    # 有效 batch = 64
  max_steps: 10000
  lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  save_every: 1000
  eval_every: 500
  dtype: float32              # MacBook CPU 使用 float32

sft:
  batch_size: 8
  gradient_accumulation: 4
  epochs: 3
  lr: 1.0e-5
  weight_decay: 0.01
  dtype: float32
  log_every: 10
  patience: 3
  use_tensorboard: false

dpo:
  batch_size: 4
  gradient_accumulation: 8
  epochs: 1
  lr: 5.0e-6
  beta: 0.1
  dtype: float32
  log_every: 10
  patience: 3
  use_tensorboard: false

generation:
  max_new_tokens: 256
  temperature: 0.7
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.1
