# ClearMind 配置 (~200M 参数)
# 适用于 GPU (24GB+ VRAM) 训练
# 训练时间: ~6-12 小时 (A100), 不建议在 MacBook 上跑

model:
  d_model: 1024         # 隐藏层维度
  n_heads: 16           # 注意力头数
  n_kv_heads: 8         # KV 头数 (GQA, 2:1 分组)
  n_layers: 16          # Transformer 层数
  d_ff: 2816            # FFN 中间维度 (≈ 2.75 × d_model)
  vocab_size: 32000     # 词表大小
  max_seq_len: 1024     # 最大序列长度
  dropout: 0.05         # 较少的 Dropout (数据量更大)
  norm_eps: 1.0e-6      # RMSNorm epsilon

tokenizer:
  model_type: bpe
  vocab_size: 32000
  character_coverage: 0.9995

pretrain:
  batch_size: 32
  gradient_accumulation: 4    # 有效 batch = 128
  max_steps: 50000
  lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  warmup_steps: 2000
  save_every: 5000
  eval_every: 1000
  dtype: bfloat16             # A100 原生支持 BF16

sft:
  batch_size: 16
  gradient_accumulation: 4
  epochs: 3
  lr: 2.0e-5
  weight_decay: 0.01
  dtype: bfloat16

dpo:
  batch_size: 8
  gradient_accumulation: 4
  epochs: 1
  lr: 5.0e-6
  beta: 0.1
  dtype: bfloat16

generation:
  max_new_tokens: 512
  temperature: 0.7
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.1
