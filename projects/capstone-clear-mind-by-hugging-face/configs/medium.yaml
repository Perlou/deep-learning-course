# ClearMind 配置 (~200M 参数)
# 适用于 GPU (24GB+ VRAM) 训练
# 训练时间: ~6-12 小时 (A100), 不建议在 MacBook 上跑

model:
  hidden_size: 1024
  num_attention_heads: 16
  num_key_value_heads: 8
  num_hidden_layers: 16
  intermediate_size: 2816
  vocab_size: 32000
  max_position_embeddings: 1024
  hidden_dropout_prob: 0.05
  rms_norm_eps: 1.0e-6
  rope_theta: 10000.0
  use_cache: true
  tie_word_embeddings: true

tokenizer:
  model_type: bpe
  vocab_size: 32000
  character_coverage: 0.9995

pretrain:
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 4
  max_steps: 50000
  learning_rate: 3.0e-4
  lr_scheduler_type: cosine
  weight_decay: 0.1
  warmup_steps: 2000
  save_steps: 5000
  eval_steps: 1000
  logging_steps: 50
  save_strategy: steps
  eval_strategy: steps
  bf16: true
  report_to: tensorboard
  gradient_checkpointing: false

sft:
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  learning_rate: 2.0e-5
  weight_decay: 0.01
  logging_steps: 50
  bf16: true
  report_to: tensorboard

dpo:
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  num_train_epochs: 1
  learning_rate: 5.0e-6
  beta: 0.1
  logging_steps: 50
  bf16: true
  report_to: tensorboard

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

generation:
  max_new_tokens: 512
  temperature: 0.7
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.1
