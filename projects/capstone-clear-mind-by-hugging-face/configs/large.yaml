# ClearMind-Plus 配置 (~930M 参数)
# 专为 A100 80GB 优化
# 训练时间: ~12-24 小时 (A100 80GB)

model:
  hidden_size: 2048
  num_attention_heads: 32
  num_key_value_heads: 8
  num_hidden_layers: 24
  intermediate_size: 5632
  vocab_size: 64000
  max_position_embeddings: 2048
  hidden_dropout_prob: 0.0
  rms_norm_eps: 1.0e-5
  rope_theta: 10000.0
  use_cache: true
  tie_word_embeddings: true

tokenizer:
  model_type: bpe
  vocab_size: 64000
  character_coverage: 0.9999

pretrain:
  per_device_train_batch_size: 24
  gradient_accumulation_steps: 8
  max_steps: 100000
  learning_rate: 3.0e-4
  lr_scheduler_type: cosine
  weight_decay: 0.1
  warmup_steps: 4000
  save_steps: 5000
  eval_steps: 2000
  logging_steps: 100
  save_strategy: steps
  eval_strategy: steps
  bf16: true
  report_to: tensorboard
  gradient_checkpointing: true
  dataloader_num_workers: 2

sft:
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 8
  num_train_epochs: 3
  learning_rate: 1.0e-5
  weight_decay: 0.01
  logging_steps: 100
  bf16: true
  report_to: tensorboard
  dataloader_num_workers: 2

dpo:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  num_train_epochs: 1
  learning_rate: 3.0e-6
  beta: 0.1
  logging_steps: 100
  bf16: true
  report_to: tensorboard
  dataloader_num_workers: 2

lora:
  r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

generation:
  max_new_tokens: 1024
  temperature: 0.7
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.1
