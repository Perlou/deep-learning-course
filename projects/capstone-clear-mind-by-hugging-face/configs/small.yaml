# ClearMind-Mini 配置 (~26M 参数)
# 适用于 MacBook CPU/MPS 训练
# 训练时间: ~3-6 小时 (MacBook), ~15 分钟 (A100)

model:
  hidden_size: 512
  num_attention_heads: 8
  num_key_value_heads: 8
  num_hidden_layers: 8
  intermediate_size: 1408
  vocab_size: 8000
  max_position_embeddings: 512
  hidden_dropout_prob: 0.1
  rms_norm_eps: 1.0e-6
  rope_theta: 10000.0
  use_cache: true
  tie_word_embeddings: true

tokenizer:
  model_type: bpe
  vocab_size: 8000
  character_coverage: 0.9995

pretrain:
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 4
  max_steps: 10000
  learning_rate: 3.0e-4
  lr_scheduler_type: cosine
  weight_decay: 0.01
  warmup_steps: 500
  save_steps: 1000
  eval_steps: 500
  logging_steps: 10
  save_strategy: steps
  eval_strategy: steps
  bf16: false
  report_to: none
  gradient_checkpointing: false

sft:
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  learning_rate: 1.0e-5
  weight_decay: 0.01
  logging_steps: 10
  bf16: false
  report_to: none

dpo:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  num_train_epochs: 1
  learning_rate: 5.0e-6
  beta: 0.1
  logging_steps: 10
  bf16: false
  report_to: none

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

generation:
  max_new_tokens: 256
  temperature: 0.7
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.1
